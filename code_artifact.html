<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطاطة الشاملة للظواهر اللغوية في اللغة العربية</title>
    
    <!-- تحميل خط تجوال من جوجل لدعم العربية بجمالية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- تحميل مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- تحميل مكتبة D3.js للرسم البياني والخرائط الذهنية -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            overflow: hidden; 
        }
        
        #mindmap-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        #mindmap-container:active {
            cursor: grabbing;
        }

        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 3px;
            transition: stroke 0.3s ease;
        }
        
        .link:hover {
            stroke: #60a5fa;
            stroke-width: 4px;
        }

        .node {
            cursor: pointer;
        }

        /* منع التحديد العشوائي للنصوص أثناء سحب الخريطة */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="relative">

    <!-- العنوان -->
    <div class="fixed top-6 right-6 z-50 bg-white/90 backdrop-blur-md p-5 rounded-2xl shadow-lg border border-slate-100 pointer-events-none">

        <p class="text-slate-500 font-medium mt-2 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block animate-pulse"></span>
            خريطة ذهنية تفاعلية للصرف والنحو
        </p>
    </div>

    <!-- أزرار التحكم -->

        <button id="zoom-in" class="bg-slate-50 p-3 rounded-lg shadow-sm hover:bg-blue-50 text-blue-600 transition-colors border border-slate-200" title="تكبير">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        <button id="zoom-out" class="bg-slate-50 p-3 rounded-lg shadow-sm hover:bg-blue-50 text-blue-600 transition-colors border border-slate-200" title="تصغير">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
        </button>
        <div class="w-px bg-slate-300 mx-1"></div>
        <button id="expand-all" class="bg-slate-50 px-5 py-2 rounded-lg shadow-sm hover:bg-blue-50 text-blue-700 font-bold transition-colors border border-slate-200 text-sm">توسيع الكل</button>
        <button id="collapse-all" class="bg-slate-50 px-5 py-2 rounded-lg shadow-sm hover:bg-blue-50 text-slate-700 font-bold transition-colors border border-slate-200 text-sm">طي الفروع</button>
        <button id="reset-zoom" class="bg-blue-600 px-5 py-2 rounded-lg shadow-md hover:bg-blue-700 text-white font-bold transition-colors text-sm">إعادة التمركز</button>
    </div>

    <!-- حاوية الخريطة الذهنية -->

                        { name: "أسلوب الشرط", desc: "أداة + فعل شرط + جواب شرط", example: "إنْ تَدْرُسْ تَنْجَحْ" },

                        { name: "أسلوب الاختصاص", desc: "ضمير يليه اسم ظاهر منصوب يفسره", example: "نحن -العربَ- نكرم الضيف" },
                        { name: "أسلوب الإغراء والتحذير", desc: "حث على محمود أو تحذير من مذموم", example: "الصدقَ الصدقَ / إياكَ والكذبَ" },
                        { name: "أسلوب القسم", desc: "حرف قسم + مقسم به + جواب القسم", example: "واللهِ لأدرسنَّ" }
                    ]

        const container = document.getElementById('mindmap-container');
        let width = container.clientWidth;
        let height = container.clientHeight;

        // إعداد التكبير والتصغير
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                svgGroup.attr("transform", event.transform);
            });

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(zoom)
            .on("dblclick.zoom", null); // منع التكبير المزدوج المزعج

        const svgGroup = svg.append("g");

        // مقاسات البطاقة وتخطيط الشجرة
        const cardWidth = 320;
        const cardHeight = 110;
        const horizontalSpacing = 420; // مسافة أفقية واسعة للرسم من اليمين لليسار
        const verticalSpacing = 160;

        const tree = d3.tree().nodeSize([verticalSpacing, horizontalSpacing]);

        const root = d3.hierarchy(treeData, d => d.children);
        root.x0 = 0;
        root.y0 = 0;

        let i = 0;

        function update(source) {
            const treeData = tree(root);
            const nodes = treeData.descendants();
            const links = treeData.links();

            // منطق RTL (Right-to-Left): العقدة الأب في اليمين والأبناء يتجهون نحو اليسار
            nodes.forEach(d => { 
                d.y = -(d.depth * horizontalSpacing); 
            });

            const node = svgGroup.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            // إنشاء العقد الجديدة
            const nodeEnter = node.enter().append('g')
                .attr('class', 'node no-select')
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .on('click', click);

            // دمج HTML (Tailwind) داخل العقدة باستخدام foreignObject
            const fo = nodeEnter.append("foreignObject")
                .attr("width", cardWidth)
                .attr("height", cardHeight)
                // تمركز البطاقة على نقطة العقدة
                .attr("x", -cardWidth / 2) 
                .attr("y", -cardHeight / 2)
                .style("overflow", "visible");

            fo.append("xhtml:div")
                .attr("class", d => `w-full h-full rounded-2xl shadow-sm border-2 p-4 flex flex-col justify-center bg-white hover:shadow-xl transition-all duration-300 relative group cursor-pointer ${d.depth === 0 ? 'border-blue-700 bg-blue-50/50' : (d.children || d._children ? 'border-blue-400' : 'border-emerald-400')}`)
                .html(d => {
                    const isRoot = d.depth === 0;
                    const hasChildren = d.children || d._children;
                    const indicatorColor = d._children ? 'bg-blue-500 shadow-blue-500/50 shadow-md' : (hasChildren ? 'bg-blue-200' : 'hidden');
                    
                    return `
                    <!-- مؤشر التفرع (دائرة صغيرة يسار البطاقة) -->
                    <div class="absolute w-4 h-4 rounded-full ${indicatorColor} -left-2 top-1/2 transform -translate-y-1/2 z-10 border-2 border-white transition-colors duration-300"></div>
                    
                    <h3 class="${isRoot ? 'text-xl' : 'text-base'} font-bold ${isRoot ? 'text-blue-900' : 'text-slate-800'} mb-1.5 leading-tight flex items-center justify-between">
                        ${d.data.name}
                        ${d._children ? '<span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-normal group-hover:bg-blue-100 group-hover:text-blue-600 transition-colors">+ مزيد</span>' : ''}
                    </h3>
                    
                    ${d.data.desc ? `<p class="text-sm text-slate-600 mb-2 leading-snug">${d.data.desc}</p>` : ''}
                    
                    ${d.data.example ? `
                        <div class="mt-auto bg-emerald-50/80 border border-emerald-100 rounded-lg px-2.5 py-1.5">
                            <p class="text-[13px] font-semibold text-emerald-800 break-words leading-tight" dir="rtl">${d.data.example}</p>
                        </div>
                    ` : ''}
                `});

            const nodeUpdate = nodeEnter.merge(node);

            // حركة انتقال العقد
            nodeUpdate.transition()
                .duration(600)
                .attr("transform", d => `translate(${d.y},${d.x})`);

            // تحديث حالة البطاقة عند التوسيع/الطي (إعادة رسم المحتوى)
            nodeUpdate.select('foreignObject div')
                .attr("class", d => `w-full h-full rounded-2xl shadow-sm border-2 p-4 flex flex-col justify-center bg-white hover:shadow-xl transition-all duration-300 relative group cursor-pointer ${d.depth === 0 ? 'border-blue-700 bg-blue-50/50' : (d.children || d._children ? 'border-blue-400' : 'border-emerald-400')}`)
                .html(d => {
                    const isRoot = d.depth === 0;
                    const hasChildren = d.children || d._children;
                    const indicatorColor = d._children ? 'bg-blue-500 shadow-blue-500/50 shadow-md' : (hasChildren ? 'bg-slate-200' : 'hidden');
                    return `
                    <div class="absolute w-4 h-4 rounded-full ${indicatorColor} -left-2 top-1/2 transform -translate-y-1/2 z-10 border-2 border-white transition-colors duration-300"></div>
                    <h3 class="${isRoot ? 'text-xl' : 'text-base'} font-bold ${isRoot ? 'text-blue-900' : 'text-slate-800'} mb-1.5 leading-tight flex items-center justify-between">
                        ${d.data.name}
                        ${d._children ? '<span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-normal group-hover:bg-blue-100 group-hover:text-blue-600 transition-colors">+ تفاصيل</span>' : ''}
                    </h3>
                    ${d.data.desc ? `<p class="text-sm text-slate-600 mb-2 leading-snug">${d.data.desc}</p>` : ''}
                    ${d.data.example ? `
                        <div class="mt-auto bg-emerald-50/80 border border-emerald-100 rounded-lg px-2.5 py-1.5">
                            <p class="text-[13px] font-semibold text-emerald-800 break-words leading-tight" dir="rtl">${d.data.example}</p>
                        </div>
                    ` : ''}
                `});

            // إزالة العقد المخفية
            const nodeExit = node.exit().transition()
                .duration(600)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .remove();

            const link = svgGroup.selectAll('path.link')
                .data(links, d => d.target.id);

            const linkEnter = link.enter().insert('path', "g")
                .attr("class", "link")
                .attr('d', d => {
                    const o = {x: source.x0, y: source.y0};
                    return diagonal(o, o);
                });

            const linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(600)
                .attr('d', d => diagonal(d.source, d.target));

            link.exit().transition()
                .duration(600)
                .attr('d', d => {
                    const o = {x: source.x, y: source.y};
                    return diagonal(o, o);
                })
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        // رسم منحنيات التوصيل (من حافة البطاقة اليمنى لحافة البطاقة اليسرى)
        function diagonal(s, d) {
            // بما أن البطاقات متمركزة، الروابط تبدأ من يسار الأب وتدخل يمين الابن
            const startY = s.y - (cardWidth / 2);
            const endY = d.y + (cardWidth / 2);
            
            return `M ${startY} ${s.x}
                    C ${(startY + endY) / 2} ${s.x},
                      ${(startY + endY) / 2} ${d.x},
                      ${endY} ${d.x}`;
        }

        // حدث النقر لفتح أو طي التفرعات
        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
            } else {
                d.children = d._children;
                d._children = null;
            }
            update(d);
        }

        // وظائف مساعدة للتوسيع والطي الشامل
        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        function expand(d) {
            if (d._children) {
                d.children = d._children;
                d._children = null;
            }
            if (d.children) {
                d.children.forEach(expand);
            }
        }

        // عند التحميل: طي كل شيء باستثناء المستوى الأول
        root.children.forEach(child => {
            if (child.children) {
                child.children.forEach(collapse);
            }
        });

        update(root);

        // ضبط التمركز الابتدائي ليكون الجذر ظاهراً بوضوح في الجهة اليمنى
        function centerRoot() {
            const initialTransform = d3.zoomIdentity.translate(width - (cardWidth + 100), height / 2).scale(0.85);
            svg.transition().duration(750).call(zoom.transform, initialTransform);
        }
        
        // استدعاء التمركز بعد الرسم
        centerRoot();

        // ربط أزرار التحكم
        document.getElementById('zoom-in').addEventListener('click', () => {
            svg.transition().duration(300).call(zoom.scaleBy, 1.3);
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        });

        document.getElementById('reset-zoom').addEventListener('click', centerRoot);

        document.getElementById('collapse-all').addEventListener('click', () => {
            root.children.forEach(collapse);
            update(root);
            centerRoot();
        });

        document.getElementById('expand-all').addEventListener('click', () => {
            expand(root);
            update(root);
        });

        // التعامل مع تغير حجم النافذة
        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;
            svg.attr("width", width).attr("height", height);
        });

    </script>
</body>
</html>
