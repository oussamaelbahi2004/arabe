<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المنصة الشاملة لعلوم اللغة العربية</title>
    
    <!-- تحميل خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- تحميل D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f8fafc; 
            margin: 0; 
            overflow: hidden; /* لمنع التمرير الافتراضي للصفحة */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* واجهة الخريطة */
        #map-view {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #f8fafc;
            z-index: 10;
        }

        #mindmap-svg-container {
            width: 100%;
            height: 100%;
            cursor: grab;
            touch-action: none; /* مهم جدا للهواتف */
        }
        #mindmap-svg-container:active {
            cursor: grabbing;
        }

        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 3px;
            transition: stroke 0.3s ease;
        }

        .node { cursor: pointer; }
        .no-select { user-select: none; -webkit-user-select: none; }

        /* تأثيرات الخلفية للواجهة الرئيسية */
        .bg-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="relative bg-slate-50 text-slate-800">

                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2 group-hover:text-blue-700 transition-colors">النحو والصرف</h2>

                dotColor: 'bg-purple-500',
                title: 'الخطاطة الشاملة للظواهر الإنشائية',
                subtitle: 'أساليب الإنشاء الطلبي وغير الطلبي وأغراضها'
            }
        };

        let currentTheme = themes.grammar;
        let d3Zoom = null;
        let d3Svg = null;
        let rootNode = null;
        let treeLayout = null;
        let svgGroup = null;

        const homeView = document.getElementById('home-view');
        const mapView = document.getElementById('map-view');

        function openMap(type) {
            // إخفاء الرئيسية وإظهار الخريطة
            homeView.classList.add('opacity-0');
            setTimeout(() => {
                homeView.classList.add('hidden');
                mapView.classList.remove('hidden');
                // Force reflow
                void mapView.offsetWidth;
                mapView.classList.remove('opacity-0');
                
                // بدء رسم الخريطة
                const data = type === 'grammar' ? grammarData : inshaData;
                currentTheme = themes[type];
                initMindMap(data, currentTheme);
            }, 500);
        }

        function closeMap() {
            mapView.classList.add('opacity-0');
            setTimeout(() => {
                mapView.classList.add('hidden');
                homeView.classList.remove('hidden');
                void homeView.offsetWidth;
                homeView.classList.remove('opacity-0');
                
                // تنظيف مساحة الرسم
                d3.select("#mindmap-svg-container").selectAll("*").remove();
            }, 500);
        }

        function initMindMap(sourceData, theme) {
            const container = document.getElementById('mindmap-svg-container');
            d3.select(container).selectAll("*").remove(); // مسح الخريطة السابقة

            let width = container.clientWidth;
            let height = container.clientHeight;

            // تحديث نصوص الواجهة
            document.getElementById('map-title').innerText = theme.title;
            document.getElementById('map-subtitle').innerText = theme.subtitle;
            document.getElementById('map-dot').className = `w-2 h-2 md:w-2.5 md:h-2.5 rounded-full inline-block animate-pulse ${theme.dotColor}`;
            document.getElementById('btn-center').className = `px-2.5 py-1.5 md:px-4 md:py-2 rounded-lg shadow-md font-bold transition-colors text-[11px] md:text-sm whitespace-nowrap ${theme.btnClass}`;

            d3Zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on("zoom", (event) => {
                    svgGroup.attr("transform", event.transform);
                });

            d3Svg = d3.select(container).append("svg")
                .attr("width", width)
                .attr("height", height)
                .call(d3Zoom)
                .on("dblclick.zoom", null);

            svgGroup = d3Svg.append("g");

            // أبعاد محسنة لتناسب الهواتف
            const cardWidth = 300;
            const cardHeight = 110;
            const horizontalSpacing = window.innerWidth < 768 ? 340 : 400; 
            const verticalSpacing = window.innerWidth < 768 ? 140 : 150;

            treeLayout = d3.tree().nodeSize([verticalSpacing, horizontalSpacing]);
            rootNode = d3.hierarchy(sourceData, d => d.children);
            rootNode.x0 = 0;
            rootNode.y0 = 0;

            let i = 0;

            function update(source) {
                const treeData = treeLayout(rootNode);
                const nodes = treeData.descendants();
                const links = treeData.links();

                // الرسم من اليمين لليسار (RTL)
                nodes.forEach(d => { d.y = -(d.depth * horizontalSpacing); });

                const node = svgGroup.selectAll('g.node')
                    .data(nodes, d => d.id || (d.id = ++i));

                const nodeEnter = node.enter().append('g')
                    .attr('class', 'node no-select')
                    .attr("transform", d => `translate(${source.y0},${source.x0})`)
                    .on('click', clickNode);

                const fo = nodeEnter.append("foreignObject")
                    .attr("width", cardWidth)
                    .attr("height", cardHeight)
                    .attr("x", -cardWidth / 2) 
                    .attr("y", -cardHeight / 2)
                    .style("overflow", "visible");

                fo.append("xhtml:div").html(d => generateCardHTML(d, theme));

                const nodeUpdate = nodeEnter.merge(node);

                nodeUpdate.transition()
                    .duration(500)
                    .attr("transform", d => `translate(${d.y},${d.x})`);

                nodeUpdate.select('foreignObject div')
                    .html(d => generateCardHTML(d, theme));

                const nodeExit = node.exit().transition()
                    .duration(500)
                    .attr("transform", d => `translate(${source.y},${source.x})`)
                    .remove();

                const link = svgGroup.selectAll('path.link')
                    .data(links, d => d.target.id);

                const linkEnter = link.enter().insert('path', "g")
                    .attr("class", "link")
                    .attr('d', d => {
                        const o = {x: source.x0, y: source.y0};
                        return diagonal(o, o);
                    });

                const linkUpdate = linkEnter.merge(link);
                linkUpdate.transition().duration(500).attr('d', d => diagonal(d.source, d.target));

                link.exit().transition().duration(500)
                    .attr('d', d => {
                        const o = {x: source.x, y: source.y};
                        return diagonal(o, o);
                    })
                    .remove();

                nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
            }

            function generateCardHTML(d, th) {
                const isRoot = d.depth === 0;
                const hasChildren = d.children || d._children;
                const isExpanded = d.children;
                
                let borderClass = isRoot ? th.rootBorder : (hasChildren ? th.parentBorder : th.childBorder);
                let bgClass = isRoot ? th.rootBg : 'bg-white';
                let textClass = isRoot ? th.rootText : 'text-slate-800';
                let indicatorClass = 'hidden';
                
                if(hasChildren) {
                    indicatorClass = isExpanded ? th.indicatorExpanded : th.indicatorHasChild;
                }

                return `
                <div class="w-full h-full rounded-2xl shadow-sm border-2 p-3.5 flex flex-col justify-center hover:shadow-xl transition-all duration-300 relative group cursor-pointer ${borderClass} ${bgClass}">
                    <div class="absolute w-3.5 h-3.5 rounded-full ${indicatorClass} -left-2 top-1/2 transform -translate-y-1/2 z-10 border-2 border-white transition-colors duration-300"></div>
                    
                    <h3 class="${isRoot ? 'text-lg' : 'text-[15px]'} font-bold ${textClass} mb-1 leading-tight flex items-center justify-between">
                        ${d.data.name}
                        ${d._children ? `<span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded-full font-normal group-hover:bg-slate-200 transition-colors">+ تفاصيل</span>` : ''}
                    </h3>
                    
                    ${d.data.desc ? `<p class="text-[12px] text-slate-600 mb-1.5 leading-snug">${d.data.desc}</p>` : ''}
                    
                    ${d.data.example ? `
                        <div class="mt-auto ${th.exampleBg} border ${th.exampleBorder} rounded-lg px-2 py-1">
                            <p class="text-[11px] font-semibold ${th.exampleText} break-words leading-tight whitespace-pre-line" dir="rtl">${d.data.example}</p>
                        </div>
                    ` : ''}
                </div>`;
            }

            function diagonal(s, d) {
                const startY = s.y - (cardWidth / 2);
                const endY = d.y + (cardWidth / 2);
                return `M ${startY} ${s.x} C ${(startY + endY) / 2} ${s.x}, ${(startY + endY) / 2} ${d.x}, ${endY} ${d.x}`;
            }

            function clickNode(event, d) {
                if (d.children) { d._children = d.children; d.children = null; } 
                else { d.children = d._children; d._children = null; }
                update(d);
            }

            function collapseAll(d) {
                if (d.children) {
                    d._children = d.children;
                    d._children.forEach(collapseAll);
                    d.children = null;
                }
            }

            function expandAll(d) {
                if (d._children) { d.children = d._children; d._children = null; }
                if (d.children) { d.children.forEach(expandAll); }
            }

            // طي مبدئي لجميع الفروع لكي لا تكون مفتوحة وتشتت التركيز
            if (rootNode.children) {
                rootNode.children.forEach(collapseAll);
            }

            update(rootNode);

            // التمركز الذكي للهاتف والحاسوب
            function centerMap() {
                const isMobile = window.innerWidth < 768;
                const scale = isMobile ? 0.45 : 0.85; 
                const rightPadding = isMobile ? 20 : 100; // مسافة الأمان من اليمين
                const topOffset = isMobile ? 100 : 0; // إزاحة لأسفل لتفادي العنوان في الهاتف
                
                const translateX = window.innerWidth - rightPadding - ((cardWidth / 2) * scale);
                const translateY = (window.innerHeight / 2) + topOffset;

                const t = d3.zoomIdentity.translate(translateX, translateY).scale(scale);
                d3Svg.transition().duration(750).call(d3Zoom.transform, t);
            }
            
            // تنفيذ التمركز بعد التهيئة بقليل لضمان دقة الأبعاد
            setTimeout(centerMap, 100);

            // ربط أزرار التحكم
            document.getElementById('btn-zoom-in').onclick = () => d3Svg.transition().duration(300).call(d3Zoom.scaleBy, 1.3);
            document.getElementById('btn-zoom-out').onclick = () => d3Svg.transition().duration(300).call(d3Zoom.scaleBy, 0.7);
            document.getElementById('btn-center').onclick = centerMap;
            
            document.getElementById('btn-collapse').onclick = () => {
                rootNode.children.forEach(collapseAll);
                update(rootNode);
                centerMap();
            };
            
            document.getElementById('btn-expand').onclick = () => {
                expandAll(rootNode);
                update(rootNode);
            };
        }
    </script>
</body>
</html>
